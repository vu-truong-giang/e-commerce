<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Quản lý danh mục phân cấp</title>
  <style>
    body { font-family: Arial; padding: 20px; }
    .category-box {
      border: 1px solid #ddd;
      padding: 10px;
      margin: 8px 0;
      border-radius: 6px;
      background: #fafafa;
    }
    .child-box { margin-left: 25px; }
    .actions { margin-top: 6px; }
    input[type="text"] {
      padding: 5px;
      width: 240px;
    }
    button { margin-left: 6px; }
  </style>
</head>
<body>
  <h2>Quản lý danh mục phân cấp</h2>
  <div id="categoryContainer"></div>

  <button id="addRootBtn">+ Thêm danh mục cấp 1</button>

  <script>
    // ✅ Dữ liệu mẫu ban đầu
    let categories = [
      {
        id: 1, name: "Thời trang", children: [
          { id: 2, name: "Áo quần nam", children: [] },
          { id: 3, name: "Áo quần nữ", children: [] }
        ]
      },
      {
        id: 4, name: "Điện tử", children: [
          { id: 5, name: "Điện thoại", children: [] },
          { id: 6, name: "Laptop", children: [] }
        ]
      }
    ];

    // ✅ Hàm render toàn bộ danh mục
    function renderCategories(list, container) {
      container.innerHTML = "";
      list.forEach((cat, index) => {
        const div = document.createElement("div");
        div.className = "category-box";

        div.innerHTML = `
          <div>
            <input type="text" value="${cat.name}" data-id="${cat.id}" />
            <button class="deleteBtn">🗑️</button>
            <button class="addChildBtn">+ Thêm con</button>
          </div>
        `;

        // Container cho danh mục con
        const childDiv = document.createElement("div");
        childDiv.className = "child-box";
        div.appendChild(childDiv);

        renderCategories(cat.children, childDiv);
        container.appendChild(div);

        // --- Gán sự kiện ---
        div.querySelector(".deleteBtn").onclick = () => {
          list.splice(index, 1);
          renderRoot();
        };

        div.querySelector(".addChildBtn").onclick = () => {
          const newId = Date.now();
          cat.children.push({ id: newId, name: "Danh mục mới", children: [] });
          renderRoot();
        };

        div.querySelector("input").oninput = (e) => {
          cat.name = e.target.value;
        };
      });
    }

    // ✅ Render gốc
    function renderRoot() {
      const container = document.getElementById("categoryContainer");
      renderCategories(categories, container);
      console.log("Dữ liệu hiện tại:", categories);
    }

    // ✅ Thêm danh mục cấp 1
    document.getElementById("addRootBtn").onclick = () => {
      const newId = Date.now();
      categories.push({ id: newId, name: "Danh mục mới", children: [] });
      renderRoot();
    };

    // ✅ Khởi tạo
    renderRoot();
  </script>
</body>
</html>
