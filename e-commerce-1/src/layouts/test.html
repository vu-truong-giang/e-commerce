<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <title>Chọn danh mục phân tầng</title>
  <style>
    body {
      font-family: "Segoe UI", sans-serif;
      background: #f9fafb;
      margin: 40px;
    }

    h2 {
      color: #333;
      margin-bottom: 20px;
    }

    .category-container {
      display: flex;
      gap: 20px;
      border: 1px solid #ddd;
      border-radius: 8px;
      background: #fff;
      padding: 16px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.05);
      width: fit-content;
    }

    .category-column {
      width: 200px;
      border-right: 1px solid #eee;
      padding-right: 10px;
    }

    .category-column:last-child {
      border-right: none;
    }

    .category-column h4 {
      margin-bottom: 10px;
      font-size: 14px;
      color: #666;
      text-transform: uppercase;
    }

    .category-item {
      padding: 6px 10px;
      cursor: pointer;
      border-radius: 4px;
      margin-bottom: 4px;
      transition: 0.2s;
    }

    .category-item:hover {
      background-color: #f0f0f0;
    }

    .category-item.active {
      background-color: #007bff;
      color: white;
    }

    .result {
      margin-top: 20px;
      font-size: 15px;
      color: #28a745;
      font-weight: 500;
    }
  </style>
</head>
<body>
  <h2>🛍️ Chọn danh mục cho sản phẩm</h2>
  <div class="category-container">
    <div class="category-column" id="level1">
      <h4>Cấp 1</h4>
      <div class="list"></div>
    </div>
    <div class="category-column" id="level2">
      <h4>Cấp 2</h4>
      <div class="list"></div>
    </div>
    <div class="category-column" id="level3">
      <h4>Cấp 3</h4>
      <div class="list"></div>
    </div>
  </div>

  <div class="result" id="result">Danh mục đã chọn: (chưa chọn)</div>

  <script>
    const categories = [
      { id: 1, name: "Thời trang nam", parent_id: null },
      { id: 2, name: "Áo", parent_id: 1 },
      { id: 3, name: "Áo Polo", parent_id: 2 },
      { id: 4, name: "Áo Sơ Mi", parent_id: 2 },
      { id: 5, name: "Quần", parent_id: 1 },
      { id: 6, name: "Thời trang nữ", parent_id: null },
      { id: 7, name: "Váy", parent_id: 6 },
      { id: 8, name: "Đầm Dạ Hội", parent_id: 6 },
    ];

    const level1 = document.querySelector("#level1 .list");
    const level2 = document.querySelector("#level2 .list");
    const level3 = document.querySelector("#level3 .list");
    const result = document.getElementById("result");

    function getChildren(parentId) {
      return categories.filter(c => c.parent_id === parentId);
    }

    function renderList(container, items, level) {
      container.innerHTML = "";
      items.forEach(item => {
        const div = document.createElement("div");
        div.className = "category-item";
        div.textContent = item.name;
        div.onclick = () => handleClick(item, level, div);
        container.appendChild(div);
      });
    }

    function handleClick(item, level, element) {
      document.querySelectorAll(`#level${level} .category-item`).forEach(e => e.classList.remove("active"));
      element.classList.add("active");

      if (level === 1) {
        renderList(level2, getChildren(item.id), 2);
        renderList(level3, [], 3);
        result.textContent = "Danh mục đã chọn: (chưa chọn)";
      } else if (level === 2) {
        renderList(level3, getChildren(item.id), 3);
        result.textContent = "Danh mục đã chọn: (chưa chọn)";
      } else if (level === 3) {
        const path = buildPath(item.id);
        result.textContent = `✅ Danh mục đã chọn: ${path.join(" › ")}`;
      }
    }

    function buildPath(id) {
      const path = [];
      let current = categories.find(c => c.id === id);
      while (current) {
        path.unshift(current.name);
        current = categories.find(c => c.id === current.parent_id);
      }
      return path;
    }

    renderList(level1, getChildren(null), 1);
  </script>
</body>
</html>
