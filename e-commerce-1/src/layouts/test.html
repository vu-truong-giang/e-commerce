<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Variant Settings - Auto Table</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <style>
    body { background-color: #f8f9fa; }
    .card { border-radius: 12px; }
    .option-box { background: #fff; border: 1px solid #dee2e6; border-radius: 8px; padding: 1rem; margin-bottom: 1rem; }
    .value-item input { width: 70%; }
    .value-item button { margin-left: 6px; }
    .variant-table th, .variant-table td { text-align: center; vertical-align: middle; }
  </style>
</head>
<body>
<div class="container mt-4">
  <h3 class="fw-bold text-primary mb-4">🛍️ Thêm sản phẩm mới</h3>

  <div class="card shadow-sm p-4">
    <h5 class="fw-semibold mb-3">Cấu hình biến thể (Variant Settings)</h5>

    <!-- Danh sách Option -->
    <div id="options-area">
      <div class="option-box">
        <div class="d-flex justify-content-between align-items-center mb-3">
          <div>
            <label class="form-label fw-semibold mb-1">Option name</label>
            <input type="text" class="form-control option-name" placeholder="VD: Màu sắc, Kích cỡ..." />
          </div>
          <button class="btn btn-outline-danger btn-sm remove-option">Xóa option</button>
        </div>
        <div class="value-area">
          <label class="form-label fw-semibold mb-2">Option values</label>
          <div class="value-list mb-2">
            <div class="d-flex value-item mb-2">
              <input type="text" class="form-control option-value" placeholder="Nhập giá trị (VD: Đỏ)" />
              <button class="btn btn-outline-danger btn-sm remove-value">✕</button>
            </div>
          </div>
          <button class="btn btn-outline-primary btn-sm add-value">+ Thêm giá trị</button>
        </div>
      </div>
    </div>

    <button id="add-option" class="btn btn-outline-success btn-sm mt-2">+ Thêm option</button>

    <hr class="my-4" />

    <!-- Bảng biến thể -->
    <div id="variant-table-area">
      <h6 class="fw-semibold mb-3">Bảng biến thể</h6>
      <table class="table table-bordered table-sm variant-table">
        <thead class="table-light">
          <tr id="variant-header">
            <th>Biến thể</th>
            <th>Giá (VNĐ)</th>
            <th>Số lượng</th>
            <th>SKU</th>
          </tr>
        </thead>
        <tbody id="variant-body">
        </tbody>
      </table>
    </div>

    <div class="d-flex justify-content-end mt-4 gap-2">
      <button class="btn btn-secondary px-4">Hủy</button>
      <button class="btn btn-primary px-4">Lưu sản phẩm</button>
    </div>
  </div>
</div>

<script>
const optionsArea = document.getElementById("options-area");
const addOptionBtn = document.getElementById("add-option");
const variantBody = document.getElementById("variant-body");

// Thêm option mới
addOptionBtn.addEventListener("click", () => {
  const optionBox = document.createElement("div");
  optionBox.className = "option-box";
  optionBox.innerHTML = `
    <div class="d-flex justify-content-between align-items-center mb-3">
      <div>
        <label class="form-label fw-semibold mb-1">Option name</label>
        <input type="text" class="form-control option-name" placeholder="VD: Màu sắc, Kích cỡ..." />
      </div>
      <button class="btn btn-outline-danger btn-sm remove-option">Xóa option</button>
    </div>
    <div class="value-area">
      <label class="form-label fw-semibold mb-2">Option values</label>
      <div class="value-list mb-2">
        <div class="d-flex value-item mb-2">
          <input type="text" class="form-control option-value" placeholder="Nhập giá trị (VD: Đỏ)" />
          <button class="btn btn-outline-danger btn-sm remove-value">✕</button>
        </div>
      </div>
      <button class="btn btn-outline-primary btn-sm add-value">+ Thêm giá trị</button>
    </div>
  `;
  optionsArea.appendChild(optionBox);
  generateVariantTable();
});

// Xử lý click
document.addEventListener("click", (e) => {
  if (e.target.classList.contains("remove-option")) {
    e.target.closest(".option-box").remove();
    generateVariantTable();
  }
  if (e.target.classList.contains("add-value")) {
    const valueList = e.target.closest(".value-area").querySelector(".value-list");
    const newValue = document.createElement("div");
    newValue.className = "d-flex value-item mb-2";
    newValue.innerHTML = `
      <input type="text" class="form-control option-value" placeholder="Nhập giá trị (VD: Đỏ)" />
      <button class="btn btn-outline-danger btn-sm remove-value">✕</button>
    `;
    valueList.appendChild(newValue);
    generateVariantTable();
  }
  if (e.target.classList.contains("remove-value")) {
    e.target.closest(".value-item").remove();
    generateVariantTable();
  }
});

// Xử lý input thay đổi
document.addEventListener("input", (e) => {
  if (e.target.classList.contains("option-name") || e.target.classList.contains("option-value")) {
    generateVariantTable();
  }
});

// Hàm lấy tất cả option và values
function getOptions() {
  const options = [];
  document.querySelectorAll(".option-box").forEach(box => {
    const name = box.querySelector(".option-name").value.trim();
    if (!name) return;
    const values = [];
    box.querySelectorAll(".option-value").forEach(v => {
      const val = v.value.trim();
      if (val) values.push(val);
    });
    if (values.length) options.push({name, values});
  });
  return options;
}

// Hàm tạo tổ hợp (cartesian product)
function cartesian(arr) {
  return arr.reduce((a,b) => a.flatMap(d => b.values.map(e => ({...d, [b.name]: e}))), [{}]);
}

// Sinh bảng biến thể
function generateVariantTable() {
  const options = getOptions();
  variantBody.innerHTML = "";
  if (!options.length) return;

  const combinations = cartesian(options);
  combinations.forEach((combo, idx) => {
    const variantName = Object.entries(combo).map(([k,v]) => `${k}: ${v}`).join(" | ");
    const row = document.createElement("tr");
    row.innerHTML = `
      <td>${variantName}</td>
      <td><input type="number" class="form-control text-center" value="0"/></td>
      <td><input type="number" class="form-control text-center" value="0"/></td>
      <td><input type="text" class="form-control text-center" value="SKU${idx+1}"/></td>
    `;
    variantBody.appendChild(row);
  });
}
</script>
</body>
</html>
